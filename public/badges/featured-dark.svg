<svg xmlns="http://www.w3.org/2000/svg" width="220" height="54" viewBox="0 0 220 54" fill="none">
  <defs>
    <linearGradient id="bgGradDark" x1="0" y1="0" x2="220" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </linearGradient>
    <linearGradient id="borderGradDark" x1="0" y1="0" x2="220" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D3139"/>
      <stop offset="100%" stop-color="#1F232B"/>
    </linearGradient>
    <linearGradient id="purpleGradDark" x1="160" y1="124" x2="384" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="cyanGradDark" x1="204" y1="252" x2="256" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00DFD8"/>
    </linearGradient>
    <filter id="shadowDark" x="0" y="0" width="220" height="54" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="218" height="52" rx="14" fill="url(#bgGradDark)" stroke="url(#borderGradDark)" stroke-width="1.5" filter="url(#shadowDark)"/>

  <!-- Logo Emblem Container with subtle borders -->
  <rect x="12" y="11" width="32" height="32" rx="9" fill="#0E1015" stroke="#2D3139" stroke-width="1"/>

  <!-- Official Raisequity Brand Logo -->
  <svg x="12" y="11" width="32" height="32" viewBox="0 0 512 512" fill="none">
    <path d="M160 172C160 145.49 181.49 124 208 124H320C355.346 124 384 152.654 384 188C384 223.346 355.346 252 320 252H256" 
          stroke="url(#purpleGradDark)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 400V320C160 275.817 195.817 240 240 240" 
          stroke="#FFFFFF" stroke-width="50" stroke-linecap="round"/>
    <path d="M246 298L360 400" 
          stroke="#FFFFFF" stroke-width="54" stroke-linecap="round"/>
    <circle cx="230" cy="278" r="28" fill="url(#cyanGradDark)" />
  </svg>

  <!-- Badge Typography -->
  <text x="54" y="24" fill="#00F5A0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1.2">FEATURED ON</text>
  <text x="54" y="39" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="-0.3">Raisequity Launch</text>
</svg>
